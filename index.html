<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Califonix | Auto Validator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        :root { --bg: #0c0c0c; --pass: #1b5e20; --fail: #8b0000; --skip: #ff6666; --ready: #121212; }
        body { font-family: 'Segoe UI', Arial; background: #000; color: white; text-align: center; margin: 0; overflow: hidden; }
        .logo { height: 35px; position: absolute; top: 10px; left: 15px; }
        .bg-pass { background: #1b5e20 !important; animation: blink 0.8s infinite; }
        @keyframes blink { 50% { background: #2ecc71; } }
        .bg-fail { background: var(--fail) !important; }
        .bg-skip { background: var(--skip) !important; }
        #view { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .status-text { font-size: 100px; font-weight: 900; margin: 0; text-transform: uppercase; }
        .mac-display { font-size: 28px; font-family: monospace; color: #0f0; background: rgba(0,0,0,0.5); padding: 10px 40px; border-radius: 10px; margin-top: 15px; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 5000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body id="ui-body">

    <img src="https://i.postimg.cc/5y7SN4xc/logo.png" class="logo">

    <div id="overlay">
        <button style="padding:20px 40px; font-size:22px; background:#e67e22; color:white; border:none; border-radius:10px; cursor:pointer;" onclick="startSession()">1. SELECT MASTER LOG & START</button>
        <p style="color:#666; margin-top:10px;">Python BT Helper must be running in background.</p>
    </div>

    <div id="view">
        <div id="dispStatus" class="status-text">READY</div>
        <div id="dispMac" class="mac-display">Waiting for BT...</div>
    </div>

    <script>
        let masterFileHandle;
        const socket = io("http://localhost:5500");

        async function startSession() {
            [masterFileHandle] = await window.showOpenFilePicker();
            document.getElementById('overlay').style.display = "none";
        }

        socket.on('new_mac', function(msg) {
            validate(msg.mac);
        });

        async function validate(mac) {
            const file = await masterFileHandle.getFile();
            const text = await file.text();
            const rows = text.split('\n');
            let res = "SKIP";

            for (let i = rows.length - 1; i >= 0; i--) {
                if (rows[i].toUpperCase().includes(mac)) {
                    res = rows[i].toUpperCase().includes("PASS") ? "PASS" : "FAIL";
                    break;
                }
            }
            showResult(mac, res);
        }

        function showResult(mac, res) {
            const body = document.getElementById('ui-body');
            const status = document.getElementById('dispStatus');
            document.getElementById('dispMac').innerText = mac;
            
            if (res === "PASS") { status.innerText = "PASS"; body.className = "bg-pass"; }
            else if (res === "FAIL") { status.innerText = "FAIL"; body.className = "bg-fail"; }
            else { status.innerText = "SKIP"; body.className = "bg-skip"; }
            
            setTimeout(() => { 
                body.className = ""; 
                status.innerText = "READY"; 
                document.getElementById('dispMac').innerText = "Waiting for next...";
            }, 5000);
        }
    </script>
</body>
</html>

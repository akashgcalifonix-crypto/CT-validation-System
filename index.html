<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Califonix | BT Quality Gate</title>
    <style>
        :root { --pass: #1b5e20; --fail: #8b0000; --skip: #ff6666; --ready: #121212; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #000; color: white; text-align: center; margin: 0; overflow: hidden; }
        .logo { height: 25px; position: absolute; top: 10px; left: 15px; }
        
        /* RESULT THEMES */
        .bg-pass { background: var(--pass) !important; animation: blink-pass 0.8s infinite; }
        @keyframes blink-pass { 50% { background: #2ecc71; } }
        .bg-fail { background: var(--fail) !important; }
        .bg-skip { background: var(--skip) !important; color: black !important; }
        .bg-ready { background: var(--ready) !important; }

        /* COMPACT DISPLAY (4-5 INCH) */
        #view { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .status-text { font-size: 80px; font-weight: 900; margin: 0; text-transform: uppercase; }
        .mac-display { font-size: 18px; font-family: monospace; color: #0f0; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 5px; margin-top: 5px; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 5000; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; }
        .btn { padding: 15px 30px; font-size: 18px; font-weight: bold; cursor: pointer; border: none; border-radius: 10px; width: 320px; color: white; }
    </style>
</head>
<body id="ui-body" class="bg-ready">

    <img src="https://i.postimg.cc/5y7SN4xc/logo.png" class="logo">

    <div id="overlay" class="overlay">
        <h2 style="color:orange;">BT QUALITY GATE START</h2>
        <button class="btn" style="background:#e67e22;" onclick="pickMasterFile()">1. SELECT MASTER LOG (NETWORK)</button>
        <button id="btnScan" class="btn" style="background:#2ecc71; display:none;" onclick="startBTAutoScan()">2. ACTIVATE AUTO-SCAN</button>
        <p style="color:#666; font-size:12px;">Permission needed for background BT scanning.</p>
    </div>

    <div id="view">
        <div id="dispStatus" class="status-text">READY</div>
        <div id="dispMac" class="mac-display">Waiting for BT Signal...</div>
    </div>

    <script>
        let masterFileHandle, lastMAC = "", scanTimeout;
        
        async function pickMasterFile() {
            try {
                [masterFileHandle] = await window.showOpenFilePicker();
                document.getElementById('btnScan').style.display = "block";
            } catch (e) { alert("File Selection Required!"); }
        }

        async function startBTAutoScan() {
            try {
                const options = { acceptAllDevices: true };
                document.getElementById('overlay').style.display = "none";
                
                // Chrome background scan request
                const scan = await navigator.bluetooth.requestLEScan({
                    keepRepeatedDevices: false,
                    acceptAllDevices: true
                });

                navigator.bluetooth.addEventListener('advertisementreceived', event => {
                    let mac = event.device.id.substring(0,17).toUpperCase();
                    let rssi = event.rssi;

                    // Industrial Filter: Only buds inside the machine (Strong Signal)
                    // RSSI > -45 means very close
                    if (rssi > -45) { 
                        if (mac !== lastMAC) {
                            lastMAC = mac;
                            validateWithMaster(mac);
                            clearTimeout(scanTimeout);
                            // Auto reset after 6 seconds of signal loss
                            scanTimeout = setTimeout(resetUI, 6000);
                        }
                    }
                });
                
                document.getElementById('dispStatus').innerText = "SCANNING";
            } catch (e) { 
                alert("Error! Did you enable Chrome Flags?\n" + e.message); 
            }
        }

        async function validateWithMaster(mac) {
            try {
                const file = await masterFileHandle.getFile();
                const text = await file.text();
                const rows = text.split('\n');
                let verdict = "SKIP";

                for (let i = rows.length - 1; i >= 0; i--) {
                    if (rows[i].toUpperCase().includes(mac.toUpperCase())) {
                        verdict = rows[i].toUpperCase().includes("PASS") ? "PASS" : "FAIL";
                        break;
                    }
                }
                showVerdict(mac, verdict);
            } catch (e) { console.error("CSV Read Error"); }
        }

        function showVerdict(mac, res) {
            const bg = document.getElementById('ui-body');
            const status = document.getElementById('dispStatus');
            document.getElementById('dispMac').innerText = mac;
            
            if (res === "PASS") {
                status.innerText = "PASS";
                bg.className = "bg-pass";
            } else if (res === "FAIL") {
                status.innerText = "FAIL";
                bg.className = "bg-fail";
            } else {
                status.innerText = "SKIP";
                bg.className = "bg-skip";
            }
        }

        function resetUI() {
            document.getElementById('ui-body').className = "bg-ready";
            document.getElementById('dispStatus').innerText = "READY";
            document.getElementById('dispMac').innerText = "Waiting for scan...";
            lastMAC = "";
        }
    </script>
</body>
</html>
